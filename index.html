<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta
      name="keywords"
      content="vtm, character creator, vtm5e, vampire the masquerade, schrecknet, WoD, world of darkness"
    />

    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <meta name="google-adsense-account" content="ca-pub-2718109649710977" />

    <!-- Open Graph / Facebook. Character pages get their own tags from
         server/sharePreview.js, which replaces these. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SchreckNet" />
    <meta property="og:title" content="SchreckNet" />
    <meta
      property="og:description"
      content="A World of Darkness character creator, manager and exporter. We offer characters from Vampire: The Masquerade, Werewolf: The Apocalypse, Hunter: The Reckoning and many other White Wolf RPG lines."
    />
    <meta
      property="og:image"
      content="https://www.schrecknet.live/og-default.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SchreckNet" />
    <meta
      name="twitter:description"
      content="A World of Darkness character creator, manager and exporter. We offer characters from Vampire: The Masquerade, Werewolf: The Apocalypse, Hunter: The Reckoning and many other White Wolf RPG lines."
    />
    <meta
      name="twitter:image"
      content="https://www.schrecknet.live/og-default.png"
    />
    <link
      rel="preload"
      href="fonts/TMUnicorn.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2718109649710977"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
